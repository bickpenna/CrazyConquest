name: C/C++ CI & Code Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-and-build:
    name: Format Check, Build & Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-format cppcheck

      - name: Check code formatting
        run: |
          make check-format

      - name: Test Compilation
        run: |
          make clean
          make CC=${{ matrix.compiler }}

      - name: Static Code Analysis (cppcheck)
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   -I src/server -I src/client -I src/common \
                   src/
